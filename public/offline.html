<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · CareerPilot</title>
    <style>
      :root { --bg: #f2f5fb; --fg: #0b1220; --muted: #5b6780; --line: #dbe2f0; --brand: #2f5bff; --card: #ffffff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #050913; --fg: #e8ecf6; --muted: #8b97b0; --line: #1c2538; --brand: #6c8dff; --card: #0b1222; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { width: min(420px, 100%); text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 32px 24px; }
      .logo { width: 64px; height: 64px; display: block; margin: 0 auto; }
      h1 { margin: 16px 0 4px; font-size: 1.5rem; }
      p { margin: 0 0 4px; color: var(--muted); }
      button { margin-top: 20px; min-height: 44px; padding: 0 22px; border: 0; border-radius: 12px; background: var(--brand); color: #fff;
        font: inherit; font-weight: 600; cursor: pointer; }
      hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
    </style>
  </head>
  <body>
    <main>
      <!-- Inline logo: the page must work with no network at all. -->
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="#2f5bff" />
        <g transform="translate(16 16) scale(1.33)" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13" />
          <path d="M22 2 15 22l-4-9-9-4 20-7Z" />
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>CareerPilot needs a connection to load your board. Check your internet and try again.</p>
      <hr />
      <h1 lang="sq">Je offline</h1>
      <p lang="sq">CareerPilot ka nevojë për internet që të hapë tabelën tënde. Kontrollo lidhjen dhe provo sërish.</p>
      <button type="button" onclick="location.reload()">Try again · Provo sërish</button>
    </main>
  </body>
</html>
